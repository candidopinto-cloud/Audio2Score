[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio2score"
version = "0.0.1"
description = "Audio/video to score and tablature, starting with nylon-string guitar"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "soundfile",
    "librosa",
    "pretty_midi",
    "music21",
    "PyGuitarPro",
]

[project.optional-dependencies]
# Basic Pitch 0.4 (Apache-2.0). On Windows it pulls TensorFlow 2.15 and pins numpy<2.
basic_pitch = ["basic-pitch>=0.4,<0.5"]
# For GAPS (Milestone 2). RTX 50-series GPUs need a CUDA 12.8+ build of torch:
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
ml = [
    "torch",
    # "gaps"  # TODO: verify how the GAPS model is distributed, then add here
]
separation = ["demucs"]
eval = ["mir_eval"]
dev = ["pytest", "ruff"]

[project.scripts]
audio2score = "audio2score.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
